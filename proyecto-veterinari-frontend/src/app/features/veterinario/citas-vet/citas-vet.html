<div class="page" style="margin-left: 210px">
  <div class="page-header">
    <div>
      <span class="page-eyebrow">— AGENDA CLÍNICA</span>
      <h2>Mis citas</h2>
      <p class="page-subtitle">Gestiona tus citas asignadas.</p>
    </div>
  </div>

  <app-gestion-tabs [tabs]="[
    { label: 'Citas', path: '/veterinario/citas' },
    { label: 'Mascotas', path: '/veterinario/mascotas' },
    { label: 'Historial médico', path: '/veterinario/historial-medico' }
  ]"></app-gestion-tabs>

  <div class="filtros-bar">
    <div class="buscador">
      🔍 <input [(ngModel)]="texto" (ngModelChange)="aplicarFiltros()" placeholder="Buscar mascota..." name="texto" />
    </div>
    <select [(ngModel)]="estadoFiltro" (ngModelChange)="aplicarFiltros()" name="estadoFiltro">
      <option>Todos los estados</option>
      <option *ngFor="let e of estados">{{ e.nombre }}</option>
    </select>
  </div>

  <div class="card">
    <table>
      <thead>
      <tr><th>Fecha</th><th>Mascota</th><th>Estado</th><th>Cambiar estado</th><th>Acciones</th></tr>
      </thead>
      <tbody>
      <tr *ngFor="let c of citasPagina">
        <td>{{ c.fechaHora | date:'short' }}</td>
        <td class="fila-avatar">
          <div class="avatar-circulo">{{ inicial(c.nombreMascota) }}</div>
          <div class="fila-info">
            <span class="fila-nombre">{{ c.nombreMascota }}</span>
            <span class="fila-detalle">{{ razaDe(c.idMascota) }}</span>
          </div>
        </td>
        <td><span [class]="badgeClass(c.estadoCita)">{{ c.estadoCita }}</span></td>
        <td>
          <select (change)="cambiarEstado(c, +$any($event.target).value)">
            <option [value]="e.id" *ngFor="let e of estados" [selected]="e.nombre === c.estadoCita">
              {{ e.nombre }}
            </option>
          </select>
        </td>
        <td class="actions">
          <a class="icon-btn" [routerLink]="['/veterinario/citas', c.idCita, 'atender']" title="Atender">🩺</a>
          <button class="icon-btn danger" *ngIf="c.estadoCita !== 'Cancelada'" (click)="cancelar(c.idCita)" title="Cancelar">🗑</button>
        </td>
      </tr>
      <tr *ngIf="citasPagina.length === 0">
        <td colspan="5">No hay citas registradas.</td>
      </tr>
      </tbody>
    </table>

    <div class="paginacion">
      <span>{{ rangoTexto }}</span>
      <div class="paginas">
        <div class="pagina-item" (click)="irAPagina(paginaActual - 1)">‹</div>
        <div class="pagina-item" [class.activa]="p === paginaActual" *ngFor="let p of paginas" (click)="irAPagina(p)">{{ p }}</div>
        <div class="pagina-item" (click)="irAPagina(paginaActual + 1)">›</div>
      </div>
    </div>
  </div>
</div>
