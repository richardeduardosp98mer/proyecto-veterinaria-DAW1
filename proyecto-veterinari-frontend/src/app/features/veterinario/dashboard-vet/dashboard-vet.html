<div class="page" style="margin-left: 210px">
  <div class="page-header">
    <div>
      <span class="page-eyebrow">— MI PANEL</span>
      <h2>Dashboard</h2>
      <p class="page-subtitle">Resumen de tu agenda del día.</p>
    </div>
  </div>

  <div class="dashboard-cards">
    <div class="card">
      <div class="card-icon icon-teal">🗓</div>
      <div class="label">Citas de hoy</div>
      <div class="valor">{{ citasHoy.length }}</div>
    </div>
    <div class="card">
      <div class="card-icon icon-orange">⏳</div>
      <div class="label">Pendientes por confirmar</div>
      <div class="valor">{{ totalPendientes }}</div>
    </div>
  </div>

  <div class="card">
    <h3>Agenda de hoy</h3>
    <table>
      <thead>
      <tr><th>Hora</th><th>Mascota</th><th>Estado</th></tr>
      </thead>
      <tbody>
      <tr *ngFor="let c of citasHoy">
        <td>{{ c.fechaHora | date:'shortTime' }}</td>
        <td>{{ c.nombreMascota }}</td>
        <td><span [class]="'badge badge-' + c.estadoCita.toLowerCase()">{{ c.estadoCita }}</span></td>
      </tr>
      <tr *ngIf="citasHoy.length === 0">
        <td colspan="3">No tienes citas programadas para hoy.</td>
      </tr>
      </tbody>
    </table>
  </div>
</div>
