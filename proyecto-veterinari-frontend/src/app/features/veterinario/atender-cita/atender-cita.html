<div class="page">
  <h2>Atender cita #{{ idCita }}</h2>

  <div class="card">
    <h3>Servicios realizados</h3>
    <div class="form-row" style="flex-direction: row; align-items: flex-end; gap: 8px;">
      <div style="flex: 1;">
        <label>Servicio</label>
        <select [(ngModel)]="idServicioSeleccionado" name="idServicio">
          <option [value]="0" disabled>Selecciona un servicio</option>
          <option [value]="s.idServicio" *ngFor="let s of servicios">{{ s.nombreServicio }} — S/ {{ s.precio }}</option>
        </select>
      </div>
      <div style="width: 80px;">
        <label>Cant.</label>
        <input [(ngModel)]="cantidad" name="cantidad" type="number" min="1" />
      </div>
      <button class="btn btn-primary" (click)="agregarServicio()">Agregar</button>
    </div>

    <table style="margin-top: 12px;">
      <thead>
      <tr><th>Servicio</th><th>Cant.</th><th>Precio unit.</th><th>Subtotal</th><th></th></tr>
      </thead>
      <tbody>
      <tr *ngFor="let d of detalles">
        <td>{{ d.nombreServicio }}</td>
        <td>{{ d.cantidad }}</td>
        <td>S/ {{ d.precioUnitario }}</td>
        <td>S/ {{ d.subtotal }}</td>
        <td><button class="btn btn-danger" (click)="eliminarDetalle(d.idDetalleServicio)">Quitar</button></td>
      </tr>
      <tr *ngIf="detalles.length === 0">
        <td colspan="5">Todavía no agregas servicios.</td>
      </tr>
      </tbody>
    </table>
  </div>

  <div class="card">
    <h3>Registrar pago</h3>
    <div class="form-grid">
      <div class="form-row">
        <label>Método de pago</label>
        <select [(ngModel)]="idMetodoPagoSeleccionado" name="idMetodoPago">
          <option [value]="0" disabled>Selecciona un método</option>
          <option [value]="m.idMetodoPago" *ngFor="let m of metodosPago">{{ m.nombreMetodoPago }}</option>
        </select>
      </div>
      <div class="form-row">
        <label>Monto (S/)</label>
        <input [(ngModel)]="monto" name="monto" type="number" step="0.01" />
      </div>
    </div>
    <div class="form-row">
      <label>Referencia (opcional)</label>
      <input [(ngModel)]="referencia" name="referencia" />
    </div>
    <button class="btn btn-primary" (click)="registrarPago()">Registrar pago</button>
  </div>

  <button class="btn btn-primary" (click)="finalizarAtencion()">Finalizar atención</button>
</div>
