<div class="page">
  <h2>Métodos de pago</h2>

  <app-gestion-tabs [tabs]="[
    { label: 'Citas', path: '/admin/citas' },
    { label: 'Mascotas', path: '/admin/mascotas' },
    { label: 'Clientes', path: '/admin/clientes' },
    { label: 'Veterinarios', path: '/admin/veterinarios' },
    { label: 'Pagos', path: '/admin/pagos' },
    { label: 'Historial médico', path: '/admin/historial-medico' }
  ]"></app-gestion-tabs>

  <div class="card">
    <div class="form-row" style="flex-direction: row; align-items: flex-end; gap: 8px;">
      <div style="flex: 1;">
        <label>Nuevo método</label>
        <input [(ngModel)]="nuevoNombre" name="nuevoNombre" placeholder="Ej: Yape" />
      </div>
      <button class="btn btn-primary" (click)="agregar()">Agregar</button>
    </div>
  </div>

  <div class="card">
    <table>
      <thead>
      <tr><th>Nombre</th><th>Acciones</th></tr>
      </thead>
      <tbody>
      <tr *ngFor="let m of metodos">
        <td>{{ m.nombreMetodoPago }}</td>
        <td class="actions">
          <button class="btn btn-danger" (click)="eliminar(m.idMetodoPago)">Eliminar</button>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</div>
